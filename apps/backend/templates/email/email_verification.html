<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ purpose }} 인증 메일</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 40px;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
        }
        .header {
            background-color: #007bff;
            padding: 30px;
            margin: -40px -40px 30px -40px;
            border-radius: 8px 8px 0 0;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            font-size: 24px;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin: 8px 0 0 0;
        }
        .content {
            margin-bottom: 30px;
            padding: 20px;
        }
        .verification-code {
            display: block;
            width: fit-content;
            margin: 30px auto;
            padding: 15px 30px;
            background-color: #f8f9fa;
            border: 2px dashed #007bff;
            border-radius: 4px;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #007bff;
        }
        .footer {
            font-size: 13px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 20px;
            text-align: center;
        }
        .highlight {
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI HealthCare</h1>
            <p>{{ purpose }} 인증을 위한 안내 메일입니다.</p>
        </div>
        <div class="content">
            <p>안녕하세요,</p>
            <p><strong>{{ email }}</strong> 계정의 <span class="highlight">{{ purpose }}</span> 인증을 위한 인증 번호가 발급되었습니다.</p>
            <p>아래의 인증 번호를 입력란에 입력하여 인증을 완료해 주세요.</p>

            <div class="verification-code">
                {{ verification_code }}
            </div>

            <p>인증 번호는 발송 후 <strong>10분</strong> 동안 유효합니다.</p>
            <p>만약 본인이 요청한 것이 아니라면, 이 메일을 무시하셔도 됩니다.</p>
        </div>
        <div class="footer">
            <p>© 2026 AI HealthCare. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
